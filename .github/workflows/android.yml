name: android ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

  emulator-smoke:
    name: emulator API ${{ matrix.api-level }}
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31, 33, 35, 36]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: Pixel_2
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
          disable-animations: true
